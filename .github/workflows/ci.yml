name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --no-deps -e .
      - name: Compile
        run: python -m compileall -q apps packages tests
      - name: Unit and integration tests (offline)
        run: python -m unittest discover -s tests -t . -v
      - name: Policy probes
        run: forge benchmark --output "${{ runner.temp }}/planner-benchmark"
      - name: Bundled Skills import cleanly
        run: forge --forge-home "${{ runner.temp }}/forge-home" import plugins/forge-skills/skills --label forge
